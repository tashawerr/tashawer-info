<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<meta name="description" content="Digital business card – Tashawer Consultation Platform">
<title>Tashawer | تشاور</title>
<style>
:root {
  --red:    #e51f35;
  --yellow: #f4bd00;
  --blue:   #78a9d8;
  --bg:     #f2f2f7;
  --card:   #ffffff;
  --sheet:  #ffffff;
  --sep:    rgba(60,60,67,.12);
  --label:  #3c3c43;
  --label2: rgba(60,60,67,.6);
  --label3: rgba(60,60,67,.3);
  --accent: #007aff;
  --green:  #34c759;
  --orange: #ff9500;
  --card-w: min(100%, 390px);
}



*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100dvh;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: calc(env(safe-area-inset-top, 0px) + 24px) 0 calc(env(safe-area-inset-bottom, 0px) + 32px);
  background: var(--bg);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  -webkit-font-smoothing: antialiased;
  color: var(--label);
}

.page {
  width: var(--card-w);
  padding: 0 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* ── Hero contact card (like iOS Contacts top) ── */
.hero {
  background: var(--card);
  border-radius: 20px;
  padding: 24px 20px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
}

.avatar-wrap {
  width: 88px;
  height: 88px;
  border-radius: 50%;
  overflow: hidden;
  margin-bottom: 12px;
  background: #e5e5ea;
  box-shadow: 0 1px 0 rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.12);
}
.avatar-wrap img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.person-name {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: .2px;
  color: var(--label);
  line-height: 1.15;
}

.person-role {
  font-size: 15px;
  color: var(--label2);
  margin-top: 2px;
  font-weight: 400;
}

.company-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin-top: 10px;
  padding: 5px 11px;
  background: rgba(0,122,255,.1);
  border-radius: 999px;
  font-size: 13px;
  font-weight: 500;
  color: var(--accent);
}

/* ── Quick-action row (like iOS Contacts buttons) ── */
.quick-actions {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-top: 16px;
  width: 100%;
}

.qa {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  text-decoration: none;
  cursor: pointer;
  background: none;
  border: none;
  font-family: inherit;
  -webkit-tap-highlight-color: transparent;
}

.qa-icon {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity .15s;
}
.qa:active .qa-icon { opacity: .6; }

.qa-icon.blue   { background: var(--accent); }
.qa-icon.green  { background: var(--green); }
.qa-icon.orange { background: var(--orange); }
.qa-icon.gray   { background: rgba(120,120,128,.2); }

.qa-icon svg { width: 22px; height: 22px; }

.qa-label {
  font-size: 11px;
  font-weight: 500;
  color: var(--accent);
  text-align: center;
  letter-spacing: .1px;
}

/* ── Grouped list (like iOS Settings / Contacts sections) ── */
.section-label {
  font-size: 13px;
  font-weight: 400;
  color: var(--label2);
  text-transform: uppercase;
  letter-spacing: .5px;
  padding: 0 6px 6px;
}

.list-group {
  background: var(--card);
  border-radius: 16px;
  overflow: hidden;
}

.list-row {
  display: flex;
  align-items: center;
  padding: 12px 16px;
  gap: 12px;
  text-decoration: none;
  color: inherit;
  position: relative;
  -webkit-tap-highlight-color: transparent;
  transition: background .12s;
  cursor: pointer;
  background: none;
  border: none;
  width: 100%;
  font-family: inherit;
  text-align: left;
}
.list-row:active { background: rgba(0,0,0,.04); }

.list-row + .list-row::before {
  content: '';
  position: absolute;
  top: 0;
  left: 56px;
  right: 0;
  height: .5px;
  background: var(--sep);
}

.row-icon {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.row-icon svg { width: 17px; height: 17px; }
.row-icon.red    { background: var(--red); }
.row-icon.blue   { background: var(--accent); }
.row-icon.green  { background: var(--green); }
.row-icon.gray   { background: #8e8e93; }
.row-icon.yellow { background: var(--yellow); }

.row-text {
  flex: 1;
  display: flex;
  flex-direction: column;
}
.row-title {
  font-size: 17px;
  font-weight: 400;
  color: var(--label);
  line-height: 1.3;
}
.row-sub {
  font-size: 13px;
  color: var(--label2);
  margin-top: 1px;
}

.row-chevron {
  color: var(--label3);
  flex-shrink: 0;
}

/* ── Arabic / branding footer ── */
.brand-footer {
  background: var(--card);
  border-radius: 16px;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.brand-en {
  font-size: 16px;
  font-weight: 700;
  color: var(--label);
}
.brand-ar {
  font-size: 18px;
  font-weight: 700;
  color: var(--label2);
  direction: rtl;
}
.accent-dots {
  display: flex;
  gap: 4px;
}
.accent-dots span {
  width: 7px;
  height: 7px;
  border-radius: 50%;
}

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
  left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: rgba(50,50,50,.92);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  color: #fff;
  font-size: 14px;
  font-weight: 500;
  padding: 10px 20px;
  border-radius: 999px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .22s, transform .22s;
  white-space: nowrap;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
</style>
</head>
